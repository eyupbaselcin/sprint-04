<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Etkinlik Ekle</title>
    <link rel="stylesheet" href="css/2321032030.css">
</head>
<body>
    <h1>Etkinlik Ekle</h1>
    
    <nav>
        <a href="index.html">Ana Sayfa</a>
        <a href="etkinlikler.html">Etkinlikler</a>
        <a href="etkinlik-ekle.html">Ekle</a>
        <a href="etkinlik-guncelle.html">Güncelle</a>
    </nav>

    <form action="#" method="POST">
        <label for="etkinlik_adi">Etkinlik adı</label>
        <input type="text" id="etkinlik_adi" name="etkinlik_adi" required>

        <label for="kategori">Kategori</label>
        <select id="kategori" name="kategori" required>
            <option value="" disabled selected>Seçiniz</option>
            <option value="seminer">Seminer</option>
            <option value="atolye">Atölye</option>
            <option value="soylesi">Söyleşi</option>
        </select>

        <label for="tarih">Tarih</label>
        <input type="date" id="tarih" name="tarih" required>

        <label for="aciklama">Açıklama</label>
        <textarea id="aciklama" name="aciklama" rows="4" required></textarea>

        <button type="submit">Kaydet</button>
    </form>
</body>
</html>
